name: Build & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow the workflow to create GitHub Releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Java 17 for Gradle 7.6.3 / AGP 7.4.2.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Flutter 3.16.9 (Dart 3.2) is required by youtube_explode_dart 3.0.0
      # (collection ^1.18.0). flutter.gradle still ships in this version.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.9"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/BlackHole-YTMusic-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackHole-YTMusic-release-apk
          path: dist/BlackHole-YTMusic-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BlackHole (YT Music) build ${{ github.run_number }}
          body: |
            Automated release build.

            Backend: YouTube Music via InnerTube (ANDROID_VR client with
            youtube_explode_dart fallback). JioSaavn/Saavn removed.

            APK is signed with the debug key (no release keystore configured),
            so it is installable for personal use.
          files: dist/BlackHole-YTMusic-release.apk
